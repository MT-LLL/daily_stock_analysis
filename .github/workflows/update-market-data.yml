name: Update Daily Market Data

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update market data
        run: python scripts/update_static_market.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/dsa-web/public/data/market.json
          if git diff --cached --quiet; then
            echo 'No market data changes.'
            exit 0
          fi
          git commit -m 'data: update daily market snapshot'
          git push
